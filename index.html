<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">

<title>Treino Trinca</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1020;
    color: #f3f4f6;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 720px;
    margin: auto;
    padding-bottom: 40px;
}

/* CABEÇALHO */

.top {
    padding: 20px 18px 8px;
    position: sticky;
    top: 0;
    background: #0b1020ee;
    backdrop-filter: blur(12px);
    z-index: 5;
}

.brand {
    font-size: 25px;
    font-weight: 800;
}

.muted {
    color: #9ca3af;
}

.small {
    font-size: 13px;
}

/* DIAS DA SEMANA */

.week {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}

.day {
    flex: 1;
    text-align: center;
    padding: 7px 2px;
    border-radius: 9px;
    background: #151c2e;
    color: #9ca3af;
    font-size: 12px;
}

.day.active {
    background: #2563eb;
    color: #fff;
}

/* NAVEGAÇÃO */

.tabs {
    display: flex;
    gap: 8px;
    padding: 10px 18px;
    background: #0b1020;
    position: sticky;
    top: 82px;
    z-index: 4;
}

.tabs button {
    flex: 1;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 10px;
    background: #1f2937;
    color: #9ca3af;
}

.tabs button.active {
    background: #374151;
    color: #fff;
}

.content {
    padding: 4px 18px;
}

/* CARDS */

.card {
    background: #151c2e;
    border: 1px solid #263149;
    border-radius: 16px;
    padding: 15px;
    margin: 12px 0;
}

.hero {
    display: flex;
    justify-content: space-between;
}

.badge {
    display: inline-block;
    background: #263149;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
}

/* EXERCÍCIOS */

.exercise h3 {
    margin: 0 0 4px;
    font-size: 17px;
}

.sets {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 40px;
    gap: 7px;
    align-items: center;
    margin-top: 10px;
}

.sets span {
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
}

.sets input {
    width: 100%;
    min-width: 0;
    background: #0d1424;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 9px;
    padding: 9px;
    text-align: center;
}

.done {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #1f2937;
    color: #fff;
}

.done.on {
    background: #16a34a;
    border-color: #16a34a;
}

/* BOTÕES */

.primary {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    font-weight: 700;
    margin-top: 8px;
}

.secondary {
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 10px;
    background: #1f2937;
    color: #fff;
}

/* CRONÔMETRO */

.row {
    display: flex;
    gap: 7px;
}

.row > * {
    flex: 1;
}

.timer {
    font-size: 34px;
    font-weight: 800;
    text-align: center;
    margin: 8px;
}

/* MEDIDAS */

.metric {
    display: flex;
    gap: 8px;
}

.metric > div {
    flex: 1;
}

.metric label {
    display: block;
    font-size: 12px;
    color: #9ca3af;
    margin-bottom: 5px;
}

.metric input {
    width: 100%;
    background: #0d1424;
    border: 1px solid #334155;
    color: #fff;
    border-radius: 10px;
    padding: 10px;
}

/* LISTA DE TREINOS */

.listbtn {
    width: 100%;
    text-align: left;
    border: 1px solid #263149;
    background: #151c2e;
    color: #fff;
    border-radius: 12px;
    padding: 13px;
    margin: 5px 0;
}

.history {
    font-size: 14px;
    line-height: 1.7;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 20px;
}
</style>
</head>

<body>

<div class="app">

<header class="top">

    <div class="brand">
        🏋️ Treino Trinca
    </div>

    <div id="subtitle" class="muted small"></div>

    <div id="week" class="week"></div>

</header>

<nav class="tabs">

    <button id="tHoje" onclick="show('hoje')">
        Hoje
    </button>

    <button id="tTreinos" onclick="show('treinos')">
        Treinos
    </button>

    <button id="tProg" onclick="show('prog')">
        Progresso
    </button>

</nav>

<main id="content" class="content"></main>

</div>

<script>

/* =====================================================
   TREINOS
===================================================== */

const workouts = {

A: {
    name: "Força + base",
    items: [
        ["Agachamento", 3, "5–8"],
        ["Supino reto", 3, "6–8"],
        ["Remada", 3, "6–10"],
        ["Stiff / terra romeno", 3, "8–10"],
        ["Elevação lateral", 3, "10–15"],
        ["Rosca direta", 2, "8–12"],
        ["Tríceps na polia", 2, "8–12"],
        ["Panturrilha", 3, "10–15"],
        ["Abdominal na polia", 3, "10–15"]
    ]
},

B: {
    name: "Hipertrofia",
    items: [
        ["Leg press", 3, "8–12"],
        ["Supino inclinado com halteres", 3, "8–12"],
        ["Puxada alta", 3, "8–12"],
        ["Mesa flexora", 3, "10–15"],
        ["Desenvolvimento com halteres", 3, "8–12"],
        ["Crossover", 2, "10–15"],
        ["Rosca martelo", 2, "10–15"],
        ["Tríceps francês", 2, "10–15"],
        ["Panturrilha sentado", 3, "12–20"],
        ["Elevação de pernas", 3, "10–15"]
    ]
},

C: {
    name: "Volume + pontos fracos",
    items: [
        ["Hack squat", 3, "8–12"],
        ["Supino máquina", 3, "8–12"],
        ["Remada baixa", 3, "8–12"],
        ["Cadeira extensora", 3, "10–15"],
        ["Mesa flexora", 3, "10–15"],
        ["Elevação lateral", 3, "12–20"],
        ["Face pull", 2, "12–20"],
        ["Rosca Scott", 2, "10–15"],
        ["Tríceps corda", 2, "10–15"],
        ["Abdominal máquina", 3, "10–15"]
    ]
},

D: {
    name: "Volume complementar",
    items: [
        ["Cadeira extensora", 3, "12–15"],
        ["Mesa flexora", 3, "12–15"],
        ["Puxada alta", 3, "10–12"],
        ["Crossover", 3, "10–15"],
        ["Elevação lateral", 3, "12–20"],
        ["Rosca martelo", 2, "10–15"],
        ["Tríceps corda", 2, "10–15"],
        ["Panturrilha", 3, "12–20"],
        ["Abdominal", 3, "12–15"]
    ]
},

E: {
    name: "Volume + condicionamento",
    items: [
        ["Leg press", 3, "10–15"],
        ["Remada sentada", 3, "10–15"],
        ["Desenvolvimento máquina", 3, "10–12"],
        ["Mesa flexora", 3, "12–15"],
        ["Elevação lateral", 3, "15–20"],
        ["Face pull", 3, "12–20"],
        ["Abdominal na polia", 3, "12–15"],
        ["Cardio moderado", 1, "20–30 min"]
    ]
}

};


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const days = [
    "Dom",
    "Seg",
    "Ter",
    "Qua",
    "Qui",
    "Sex",
    "Sáb"
];

/*
    Segunda = A
    Terça   = D
    Quarta  = B
    Quinta  = E
    Sexta   = C
*/

const order = {
    1: "A",
    2: "D",
    3: "B",
    4: "E",
    5: "C"
};

let current =
    order[new Date().getDay()] || "A";

let tab = "hoje";

let timerInt = null;

const storageKey = "treinoTrincaData";

let data =
    JSON.parse(
        localStorage.getItem(storageKey) ||
        '{"sessions":[],"metrics":[]}'
    );


/* =====================================================
   STORAGE
===================================================== */

function save() {

    localStorage.setItem(
        storageKey,
        JSON.stringify(data)
    );

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

function init() {

    const d = new Date();

    document.getElementById("subtitle")
        .textContent =
        d.toLocaleDateString(
            "pt-BR",
            {
                weekday: "long",
                day: "2-digit",
                month: "long"
            }
        );

    document.getElementById("week")
        .innerHTML =
        days.map(
            (x, i) => `
                <div class="day ${
                    i === d.getDay()
                    ? "active"
                    : ""
                }">
                    ${x}
                </div>
            `
        ).join("");

    show("hoje");

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function show(x) {

    tab = x;

    [
        "tHoje",
        "tTreinos",
        "tProg"
    ].forEach(
        id =>
            document
                .getElementById(id)
                .classList
                .remove("active")
    );

    document
        .getElementById(
            x === "hoje"
                ? "tHoje"
                : x === "treinos"
                    ? "tTreinos"
                    : "tProg"
        )
        .classList
        .add("active");

    render();

}


function render() {

    const c =
        document.getElementById("content");

    if (tab === "hoje") {

        renderWorkout(c);

        return;
    }

    if (tab === "treinos") {

        renderList(c);

        return;
    }

    renderProgress(c);

}


/* =====================================================
   TELA DO TREINO
===================================================== */

function renderWorkout(c) {

    const w = workouts[current];

    const last =
        data.sessions
            .filter(
                s => s.code === current
            )
            .slice(-1)[0];

    c.innerHTML = `

        <div class="card hero">

            <div>

                <span class="badge">
                    Treino ${current}
                </span>

                <h2>
                    ${w.name}
                </h2>

                <div class="muted small">
                    Termine a maioria das séries
                    com 1–3 repetições na reserva.
                </div>

            </div>

        </div>

        <div id="exercises"></div>

        <button
            class="primary"
            onclick="finish()">

            Finalizar treino

        </button>


        <div class="card">

            <div class="row">

                <button
                    class="secondary"
                    onclick="startTimer(60)">

                    60s

                </button>

                <button
                    class="secondary"
                    onclick="startTimer(90)">

                    90s

                </button>

                <button
                    class="secondary"
                    onclick="startTimer(120)">

                    120s

                </button>

            </div>

            <div
                id="timer"
                class="timer">

                00:00

            </div>

            <button
                class="secondary"
                style="width:100%"
                onclick="stopTimer()">

                Parar

            </button>

        </div>
    `;


    const e =
        document.getElementById("exercises");


    w.items.forEach(
        (it, i) => {

            const old =
                last?.exercises?.[i];

            let rows = "";


            for (
                let s = 0;
                s < it[1];
                s++
            ) {

                rows += `

                    <span>
                        ${s + 1}
                    </span>

                    <input
                        inputmode="decimal"
                        placeholder="kg"
                        value="${
                            old
                            ?.sets?.[s]
                            ?.kg || ""
                        }"
                        data-e="${i}"
                        data-s="${s}"
                        class="kg">

                    <input
                        inputmode="numeric"
                        placeholder="reps"
                        value="${
                            old
                            ?.sets?.[s]
                            ?.reps || ""
                        }"
                        data-e="${i}"
                        data-s="${s}"
                        class="reps">

                    <button
                        class="done"
                        onclick="
                            this.classList.toggle('on')
                        ">

                        ✓

                    </button>
                `;
            }


            e.innerHTML += `

                <div class="card exercise">

                    <h3>
                        ${i + 1}.
                        ${it[0]}
                    </h3>

                    <div class="muted small">

                        ${it[1]} séries
                        ·
                        ${it[2]} repetições

                    </div>

                    <div class="sets">

                        <span>Série</span>
                        <span>KG</span>
                        <span>Reps</span>
                        <span>OK</span>

                        ${rows}

                    </div>

                </div>
            `;
        }
    );

}


/* =====================================================
   FINALIZAR TREINO
===================================================== */

function finish() {

    const exercises =
        workouts[current].items.map(
            (it, i) => {

                const sets = [];

                document
                    .querySelectorAll(
                        `.kg[data-e="${i}"]`
                    )
                    .forEach(
                        (el, j) => {

                            const rep =
                                document.querySelector(
                                    `.reps[data-e="${i}"][data-s="${j}"]`
                                );

                            sets.push({

                                kg: el.value,

                                reps:
                                    rep.value

                            });

                        }
                    );

                return {

                    name: it[0],

                    sets

                };

            }
        );


    data.sessions.push({

        date:
            new Date().toISOString(),

        code:
            current,

        exercises

    });


    save();


    alert(
        "Treino salvo! 💪"
    );


    show("prog");

}


/* =====================================================
   LISTA DE TREINOS
===================================================== */

function renderList(c) {

    c.innerHTML = `

        <div class="card">

            <h2>
                Seus treinos
            </h2>

            <div class="muted small">
                Escolha qualquer treino.
            </div>

        </div>

        ${
            Object.entries(workouts)
                .map(
                    ([k, w]) => `

                        <button
                            class="listbtn"
                            onclick="
                                current='${k}';
                                show('hoje');
                            ">

                            <b>
                                Treino ${k}
                            </b>

                            —
                            ${w.name}

                            <br>

                            <span class="muted small">

                                ${w.items.length}
                                exercícios

                            </span>

                        </button>

                    `
                )
                .join("")
        }

    `;

}


/* =====================================================
   PROGRESSO
===================================================== */

function renderProgress(c) {

    const recent =
        data.sessions
            .slice(-8)
            .reverse();


    c.innerHTML = `

        <div class="card">

            <h2>
                Progresso
            </h2>

            <div class="metric">

                <div>

                    <label>
                        Peso (kg)
                    </label>

                    <input
                        id="peso"
                        inputmode="decimal"
                        placeholder="82,5">

                </div>

                <div>

                    <label>
                        Cintura (cm)
                    </label>

                    <input
                        id="cintura"
                        inputmode="decimal"
                        placeholder="88">

                </div>

            </div>


            <button
                class="primary"
                onclick="saveMetric()">

                Salvar medidas

            </button>

        </div>


        <div class="card">

            <h3>
                Últimos treinos
            </h3>

            ${
                recent.length

                ?

                recent.map(
                    s => `

                        <div class="history">

                            <b>
                                Treino ${s.code}
                            </b>

                            ·

                            ${
                                new Date(
                                    s.date
                                ).toLocaleDateString(
                                    "pt-BR"
                                )
                            }

                        </div>

                    `
                ).join("")

                :

                `
                    <div class="empty">

                        Nenhum treino salvo ainda.

                    </div>
                `
            }

        </div>


        <div class="card">

            <h3>
                Medidas recentes
            </h3>

            ${
                data.metrics
                    .slice(-8)
                    .reverse()
                    .map(
                        m => `

                            <div class="history">

                                ${
                                    new Date(
                                        m.date
                                    ).toLocaleDateString(
                                        "pt-BR"
                                    )
                                }

                                —

                                ${
                                    m.weight || "—"
                                }
                                kg

                                · cintura

                                ${
                                    m.waist || "—"
                                }
                                cm

                            </div>

                        `
                    )
                    .join("")

                ||

                `
                    <div class="empty">

                        Nenhuma medida registrada.

                    </div>
                `
            }

        </div>


        <div class="card">

            <button
                class="secondary"
                onclick="exportData()">

                📤 Exportar dados

            </button>

            <button
                class="secondary"
                onclick="clearData()">

                Limpar

            </button>

        </div>

    `;

}


/* =====================================================
   SALVAR PESO / CINTURA
===================================================== */

function saveMetric() {

    const weight =
        document
            .getElementById("peso")
            .value
            .replace(",", ".");

    const waist =
        document
            .getElementById("cintura")
            .value
            .replace(",", ".");


    if (!weight && !waist) {

        alert(
            "Preencha pelo menos uma medida."
        );

        return;
    }


    data.metrics.push({

        date:
            new Date().toISOString(),

        weight,

        waist

    });


    save();


    renderProgress(
        document.getElementById("content")
    );

}


/* =====================================================
   CRONÔMETRO
===================================================== */

function startTimer(sec) {

    stopTimer();

    let left = sec;

    const el =
        document.getElementById("timer");


    function tick() {

        el.textContent =
            `${String(
                Math.floor(left / 60)
            ).padStart(2, "0")}:${String(
                left % 60
            ).padStart(2, "0")}`;


        if (left <= 0) {

            clearInterval(timerInt);

            timerInt = null;

            navigator
                .vibrate?.(300);

            alert(
                "Descanso encerrado!"
            );

        }


        left--;

    }


    tick();

    timerInt =
        setInterval(
            tick,
            1000
        );

}


function stopTimer() {

    if (timerInt) {

        clearInterval(
            timerInt
        );

        timerInt = null;

    }


    const el =
        document.getElementById("timer");


    if (el) {

        el.textContent =
            "00:00";

    }

}


/* =====================================================
   EXPORTAR DADOS
===================================================== */

function exportData() {

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const a =
        document.createElement("a");


    a.href =
        URL.createObjectURL(blob);


    a.download =
        "treino-trinca-backup.json";


    a.click();


    URL.revokeObjectURL(
        a.href
    );

}


/* =====================================================
   LIMPAR
===================================================== */

function clearData() {

    if (
        confirm(
            "Apagar todo o histórico?"
        )
    ) {

        data = {

            sessions: [],

            metrics: []

        };


        save();


        renderProgress(
            document.getElementById(
                "content"
            )
        );

    }

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
