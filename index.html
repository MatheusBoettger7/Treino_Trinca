<body><div class="app"><header class="top"><div class="brand">🏋️ Treino Trinca</div><div id="subtitle" class="muted small"></div><div id="week" class="week"></div><button id="installBtn" class="install-btn" type="button" hidden>📲 Instalar aplicativo</button><div class="profile-switch"><span>Perfil de treino</span><div class="profile-buttons"><button id="profileMale" onclick="switchProfile('masculino')">🏋️ Matheus</button><button id="profileFemale" onclick="switchProfile('feminino')">👩 Eloiza</button></div></div></header><nav class="tabs"><button id="tHoje" onclick="show('hoje')">Hoje</button><button id="tTreinos" onclick="show('treinos')">Treinos</button><button id="tProg" onclick="show('prog')">Progresso</button></nav><main id="content" class="content"></main></div>
<script>
const workouts={
A:{name:'Força + base',items:[['Agachamento',3,'5–8'],['Supino reto',3,'6–8'],['Remada',3,'6–10'],['Stiff / terra romeno',3,'8–10'],['Elevação lateral',3,'10–15'],['Rosca direta',2,'8–12'],['Tríceps na polia',2,'8–12'],['Panturrilha',3,'10–15'],['Abdominal na polia',3,'10–15']]},
B:{name:'Hipertrofia',items:[['Leg press',3,'8–12'],['Supino inclinado com halteres',3,'8–12'],['Puxada alta',3,'8–12'],['Mesa flexora',3,'10–15'],['Desenvolvimento com halteres',3,'8–12'],['Crossover',2,'10–15'],['Rosca martelo',2,'10–15'],['Tríceps francês',2,'10–15'],['Panturrilha sentado',3,'12–20'],['Elevação de pernas',3,'10–15']]},

D:{name:'Volume complementar',items:[['Cadeira extensora',3,'12–15'],['Mesa flexora',3,'12–15'],['Puxada alta',3,'10–12'],['Crossover',3,'10–15'],['Elevação lateral',3,'12–20'],['Rosca martelo',2,'10–15'],['Tríceps corda',2,'10–15'],['Panturrilha',3,'12–20'],['Abdominal',3,'12–15']]},
E:{name:'Volume + condicionamento',items:[['Leg press',3,'10–15'],['Remada sentada',3,'10–15'],['Desenvolvimento máquina',3,'10–12'],['Mesa flexora',3,'12–15'],['Elevação lateral',3,'15–20'],['Face pull',3,'12–20'],['Abdominal na polia',3,'12–15'],['Cardio moderado',1,'20–30 min']]},
F:{name:'Glúteos + quadríceps',items:[['Elevação pélvica',4,'8–12'],['Leg press',3,'8–12'],['Agachamento búlgaro',3,'8–10 cada perna'],['Cadeira extensora',3,'10–15'],['Coice na polia',3,'12–15 cada perna'],['Abdutora',3,'15–20']]},
G:{name:'Costas + ombros + braços',items:[['Puxada alta',3,'8–12'],['Remada sentada',3,'8–12'],['Supino inclinado com halteres',3,'8–12'],['Elevação lateral',3,'12–20'],['Face pull',2,'12–20'],['Rosca martelo',2,'10–15'],['Tríceps corda',2,'10–15'],['Abdominal na polia',3,'10–15']]},
H:{name:'Glúteos + posterior',items:[['Elevação pélvica',4,'8–12'],['Step-up',3,'8–10 cada perna'],['Stiff com halteres ou barra',3,'8–12'],['Mesa flexora',3,'10–15'],['Coice na polia',3,'12–15 cada perna'],['Abdutora',3,'15–20']]},
I:{name:'Superior + condicionamento',items:[['Supino máquina',3,'8–12'],['Remada sentada',3,'10–15'],['Desenvolvimento máquina',3,'8–12'],['Puxada alta',3,'10–12'],['Elevação lateral',3,'12–20'],['Tríceps corda',2,'10–15'],['Rosca martelo',2,'10–15'],['Cardio moderado',1,'20–30 min']]},
J:{name:'Pernas + glúteos',items:[['Hack squat',3,'8–12'],['Elevação pélvica',3,'8–12'],['Cadeira extensora',3,'10–15'],['Mesa flexora',3,'10–15'],['Abdutora',3,'15–20'],['Panturrilha',3,'12–20'],['Abdominal na polia',3,'12–15']]}
};
const exerciseInfo={
'Agachamento':['Quadríceps, glúteos','barra e agachamento'], 'Supino reto':['Peito, tríceps','barra e banco'], 'Remada':['Costas, bíceps','remada com barra'], 'Stiff / terra romeno':['Posterior de coxa, glúteos','levantamento romeno'], 'Elevação lateral':['Ombros','elevação lateral'], 'Rosca direta':['Bíceps','rosca com barra'], 'Tríceps na polia':['Tríceps','polia alta'], 'Panturrilha':['Panturrilhas','elevação de panturrilha'], 'Abdominal na polia':['Abdômen','polia ajoelhado'],
'Leg press':['Quadríceps, glúteos','leg press'], 'Supino inclinado com halteres':['Peito superior, ombros','halteres em banco inclinado'], 'Puxada alta':['Costas, bíceps','puxada na polia'], 'Mesa flexora':['Posterior de coxa','mesa flexora'], 'Desenvolvimento com halteres':['Ombros, tríceps','halteres acima da cabeça'], 'Crossover':['Peito','crossover na polia'], 'Rosca martelo':['Bíceps, antebraços','rosca martelo'], 'Tríceps francês':['Tríceps','halter acima da cabeça'], 'Panturrilha sentado':['Panturrilhas','panturrilha sentado'], 'Elevação de pernas':['Abdômen','elevação de pernas'],
'Hack squat':['Quadríceps, glúteos','hack squat'], 'Supino máquina':['Peito, tríceps','supino na máquina'], 'Remada baixa':['Costas, bíceps','remada baixa'], 'Cadeira extensora':['Quadríceps','cadeira extensora'], 'Face pull':['Ombros posteriores, costas','face pull'], 'Rosca Scott':['Bíceps','rosca Scott'], 'Tríceps corda':['Tríceps','corda na polia'], 'Abdominal máquina':['Abdômen','abdominal na máquina'],
'Remada sentada':['Costas, bíceps','remada sentada'], 'Desenvolvimento máquina':['Ombros, tríceps','desenvolvimento na máquina'], 'Abdominal':['Abdômen','abdominal'], 'Cardio moderado':['Condicionamento cardiovascular','cardio moderado']};
const extraExerciseInfo={
'Elevação pélvica':['Glúteos, posterior de coxa','hip thrust com barra'],'Agachamento búlgaro':['Quadríceps, glúteos','agachamento búlgaro'],'Coice na polia':['Glúteos','coice na polia'],'Abdutora':['Glúteos médio e mínimo','máquina abdutora'],'Step-up':['Quadríceps, glúteos','step-up no banco'],'Stiff com halteres ou barra':['Posterior de coxa, glúteos','levantamento romeno']
};
const exerciseMedia={"Agachamento": "squat", "Supino reto": "bench-press", "Remada": "bent-over-barbell-row", "Stiff / terra romeno": "romanian-deadlift", "Elevação lateral": "dumbbell-lateral-raise", "Rosca direta": "barbell-curl", "Tríceps na polia": "cable-tricep-pushdown", "Panturrilha": "standing-calf-raise", "Abdominal na polia": "kneeling-cable-crunch", "Leg press": "leg-press", "Supino inclinado com halteres": "incline-db-press", "Puxada alta": "lat-pulldown", "Mesa flexora": "leg-curl", "Desenvolvimento com halteres": "dumbbell-shoulder-press", "Crossover": "cable-fly", "Rosca martelo": "hammer-curl", "Tríceps francês": "overhead-tricep-extension", "Panturrilha sentado": "seated-calf-raise", "Elevação de pernas": "hanging-leg-raise", "Hack squat": "hack-squat", "Supino máquina": "chest-press-machine", "Remada baixa": "seated-cable-row", "Cadeira extensora": "leg-extension", "Face pull": "face-pull", "Rosca Scott": "preacher-curl", "Tríceps corda": "rope-tricep-pushdown", "Abdominal máquina": "machine-seated-crunch", "Remada sentada": "seated-cable-row", "Desenvolvimento máquina": "machine-shoulder-press", "Abdominal": "crunch", "Cardio moderado": "incline-treadmill-walk", "Elevação pélvica": "hip-thrust", "Agachamento búlgaro": "bulgarian-split-squat", "Coice na polia": "glute-kickback", "Abdutora": "hip-abduction", "Step-up": "step-up", "Stiff com halteres ou barra": "romanian-deadlift"};
function exerciseImage(name){
  const slug=exerciseMedia[name];
  return slug?`https://exercise-dataset.com/images/flat/${slug}-peak.webp`:'';
}
function exerciseImageError(image){
  if(image.dataset.fallback!=='1' && image.dataset.exercise){
    image.dataset.fallback='1';
    const slug=exerciseMedia[image.dataset.exercise];
    if(slug){image.src=`https://exercise-dataset.com/images/flat/${slug}-start.webp`;return;}
  }
  image.hidden=true;
  image.closest('.exercise-head')?.classList.add('without-image');
}

const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const profiles={masculino:{label:'Masculino',emoji:'🏋️',order:{1:'A',2:'D',3:'B',4:'E',5:'C'},codes:['A','B','C','D','E']},feminino:{label:'Feminino',emoji:'👩',order:{1:'F',2:'G',3:'H',4:'I',5:'J'},codes:['F','G','H','I','J']}};
const storageKey='treinoTrincaData';
let profile=localStorage.getItem('treinoTrincaProfile')==='feminino'?'feminino':'masculino';
let current=profiles[profile].order[new Date().getDay()]||profiles[profile].codes[0],tab='hoje',timerInt=null,selectedExercise='';let data=loadData();
function loadData(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{"sessions":[],"metrics":[]}');return {sessions:Array.isArray(saved.sessions)?saved.sessions.map(s=>({...s,profile:s.profile||'masculino'})):[],metrics:Array.isArray(saved.metrics)?saved.metrics.map(m=>({...m,profile:m.profile||'masculino'})):[]}}catch{return {sessions:[],metrics:[]}}}
function save(){localStorage.setItem(storageKey,JSON.stringify(data))}
function switchProfile(next){profile=next;localStorage.setItem('treinoTrincaProfile',profile);current=profiles[profile].order[new Date().getDay()]||profiles[profile].codes[0];selectedExercise='';show('hoje')}
function sessionData(){return data.sessions.filter(s=>s.profile===profile)}
function metricData(){return data.metrics.filter(m=>m.profile===profile)}function n(v){return Number(String(v||'').replace(',','.'))||0}function date(s){return new Date(s).toLocaleDateString('pt-BR')}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function init(){setupInstall();const d=new Date();subtitle.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});week.innerHTML=days.map((x,i)=>`<div class="day ${i===d.getDay()?'active':''}">${x}</div>`).join('');show('hoje');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}function show(x){tab=x;['tHoje','tTreinos','tProg'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(x==='hoje'?'tHoje':x==='treinos'?'tTreinos':'tProg').classList.add('active');render()}function render(){document.getElementById('profileMale').classList.toggle('active',profile==='masculino');document.getElementById('profileFemale').classList.toggle('active',profile==='feminino');const c=document.getElementById('content');if(tab==='hoje')renderWorkout(c);else if(tab==='treinos')renderList(c);else renderProgress(c)}
function lastExercise(name){const sessions=sessionData();for(let i=sessions.length-1;i>=0;i--){const ex=sessions[i].exercises?.find(x=>x.name===name);if(ex)return ex}return null}function progression(name){const ex=lastExercise(name);if(!ex)return '';const valid=(ex.sets||[]).filter(s=>n(s.kg)>0&&n(s.reps)>0);if(!valid.length)return '';const maxKg=Math.max(...valid.map(s=>n(s.kg)));const best=valid.filter(s=>n(s.kg)===maxKg).reduce((a,s)=>!a||n(s.reps)>n(a.reps)?s:a,null);if(!best)return '';const reps=n(best.reps);const nextKg=maxKg+2.5;return `Último: ${best.kg} kg × ${best.reps}${reps>=10?` → tente ${nextKg.toLocaleString('pt-BR')} kg`:''}`}function renderWorkout(c){const w=workouts[current];c.innerHTML=`<div class="card hero"><div><span class="badge">Treino ${current}</span><h2>${w.name}</h2><div class="muted small">Complete uma série para iniciar automaticamente 90 s de descanso.</div></div></div><div id="exercises"></div><button class="primary" onclick="finish()">Finalizar treino</button><div class="card"><div class="row"><button class="secondary" onclick="startTimer(60)">60s</button><button class="secondary" onclick="startTimer(90)">90s</button><button class="secondary" onclick="startTimer(120)">120s</button></div><div id="timer" class="timer">00:00</div><button class="secondary" style="width:100%" onclick="stopTimer()">Parar</button></div>`;const holder=document.getElementById('exercises');w.items.forEach((it,i)=>{const old=lastExercise(it[0]);let rows='';for(let s=0;s<it[1];s++){const set=old?.sets?.[s]||{};rows+=`<span>${s+1}</span><input inputmode="decimal" placeholder="kg" value="${esc(set.kg||'')}" data-e="${i}" data-s="${s}" class="kg"><input inputmode="numeric" placeholder="reps" value="${esc(set.reps||'')}" data-e="${i}" data-s="${s}" class="reps"><button class="done" data-e="${i}" data-s="${s}" onclick="completeSet(this)">✓</button>`}holder.innerHTML+=`<div class="card exercise"><div class="exercise-head"><div><h3>${i+1}. ${it[0]}</h3><div class="muted small">${it[1]} séries · ${it[2]} repetições</div><div class="muscle-chip"><i></i>${(exerciseInfo[it[0]]||extraExerciseInfo[it[0]])?.[0]||'Corpo inteiro'}</div></div><img class="exercise-visual" src="${exerciseImage(it[0])}" alt="Demonstração de ${esc(it[0])}" loading="lazy" decoding="async" referrerpolicy="no-referrer" tabindex="0" data-exercise="${esc(it[0])}" onclick="openExerciseImage(this.dataset.exercise)" onerror="exerciseImageError(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openExerciseImage(this.dataset.exercise)}"></div><div class="hint">${progression(it[0])||'Sem histórico neste exercício.'}</div><div class="sets"><span>Série</span><span>KG</span><span>Reps</span><span>OK</span>${rows}</div></div>`})}
function openExerciseImage(name){const d=document.getElementById('exerciseImageDialog');d.querySelector('img').src=exerciseImage(name);d.querySelector('img').alt=`Demonstração de ${name}`;d.querySelector('strong').textContent=name;d.showModal()}function completeSet(button){button.classList.toggle('on');if(button.classList.contains('on'))startTimer(90)}function finish(){const exercises=workouts[current].items.map((it,i)=>({name:it[0],sets:[...document.querySelectorAll(`.kg[data-e="${i}"]`)].map((el,j)=>{const done=document.querySelector(`.done[data-e="${i}"][data-s="${j}"]`);const rep=document.querySelector(`.reps[data-e="${i}"][data-s="${j}"]`);return {kg:el.value,reps:rep.value,done:done?.classList.contains('on')||false}})}));const useful=exercises.some(ex=>ex.sets.some(s=>n(s.kg)||n(s.reps)));if(!useful){alert('Registre ao menos uma carga ou repetição antes de salvar.');return}data.sessions.push({date:new Date().toISOString(),code:current,profile,exercises});save();stopTimer();alert('Treino salvo! 💪');show('prog')}
function renderList(c){const p=profiles[profile];const currentLabel=p.label;const codes=p.codes;c.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2 style="margin:0 0 4px">Treinos ${p.emoji}</h2><div class="muted small">Perfil atual: <b>${currentLabel}</b></div></div><span class="badge">${codes.length} treinos</span></div><div class="muted small" style="margin-top:10px">Escolha um treino para abrir. O outro perfil fica separado.</div></div>${codes.map(k=>{const w=workouts[k];const isCurrent=k===current;return `<button class="listbtn ${isCurrent?'selected-workout':''}" onclick="current='${k}';show('hoje')"><b>Treino ${k}</b> — ${w.name}${isCurrent?' · Hoje':''}<br><span class="muted small">${w.items.length} exercícios</span></button>`}).join('')}`}
function weekStats(){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const ss=sessionData().filter(s=>new Date(s.date)>=start);let sets=0,volume=0;ss.forEach(s=>s.exercises?.forEach(e=>e.sets?.forEach(x=>{if(n(x.kg)||n(x.reps)){sets++;volume+=n(x.kg)*n(x.reps)}})));return {sessions:ss.length,sets,volume:Math.round(volume)}}function chart(){const ms=metricData().slice(-12);if(!ms.length)return '<div class="empty">Registre medidas para visualizar o gráfico.</div>';const path=(key,min,max)=>{const range=max-min||1;return ms.map((m,i)=>{const v=n(m[key]);const y=v?130-((v-min)/range)*105:130;return `${i?'L':'M'} ${i*(280/Math.max(ms.length-1,1))+10} ${y}`}).join(' ')};const weights=ms.map(m=>n(m.weight)).filter(Boolean),waists=ms.map(m=>n(m.waist)).filter(Boolean),wMin=weights.length?Math.min(...weights):0,wMax=weights.length?Math.max(...weights):1,cMin=waists.length?Math.min(...waists):0,cMax=waists.length?Math.max(...waists):1;return `<svg class="chart" viewBox="0 0 300 150" role="img" aria-label="Gráfico de evolução"><line x1="10" y1="130" x2="290" y2="130" stroke="#334155"/><path d="${weights.length?path('weight',wMin,wMax):''}" fill="none" stroke="#60a5fa" stroke-width="3"/><path d="${waists.length?path('waist',cMin,cMax):''}" fill="none" stroke="#f59e0b" stroke-width="3"/></svg><div class="legend"><span><i class="dot" style="background:#60a5fa"></i>Peso</span><span><i class="dot" style="background:#f59e0b"></i>Cintura</span><span>Último: ${ms.at(-1).weight||'—'} kg · ${ms.at(-1).waist||'—'} cm</span></div>`}function calendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),total=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),trained=new Set(sessionData().map(s=>new Date(s.date).toDateString()));let out='';for(let i=0;i<first.getDay();i++)out+='<div></div>';for(let d=1;d<=total;d++){const x=new Date(now.getFullYear(),now.getMonth(),d);out+=`<div class="cal-day ${trained.has(x.toDateString())?'trained':''}">${d}</div>`}return out}function allExercises(){return [...new Set(sessionData().flatMap(s=>s.exercises?.map(e=>e.name)||[]))]}function exerciseHistory(name){const logs=sessionData().flatMap(s=>(s.exercises||[]).filter(e=>e.name===name).map(e=>({date:s.date,sets:e.sets||[]}))).reverse();if(!logs.length)return '<div class="empty">Escolha um exercício com histórico.</div>';return logs.slice(0,8).map(l=>`<div class="history"><b>${date(l.date)}</b> — ${l.sets.filter(x=>n(x.kg)||n(x.reps)).map(x=>`${x.kg||'—'} kg × ${x.reps||'—'}`).join(' · ')}</div>`).join('')}function prs(){const best={};sessionData().forEach(s=>s.exercises?.forEach(e=>e.sets?.forEach(x=>{const kg=n(x.kg),reps=n(x.reps);if(!kg||!reps)return;const old=best[e.name];if(!old||kg>old.kg||(kg===old.kg&&reps>old.reps))best[e.name]={kg,reps}})));const entries=Object.entries(best);return entries.length?entries.sort((a,b)=>b[1].kg-a[1].kg).map(([name,v])=>`<div class="pr"><span>${esc(name)}</span><b>${v.kg} kg · ${v.reps} reps</b></div>`).join(''):'<div class="empty">Seus recordes aparecerão aqui.</div>'}function renderProgress(c){const stats=weekStats(),recent=sessionData().slice(-8).reverse(),exercises=allExercises();if(!selectedExercise&&exercises.length)selectedExercise=exercises[0];c.innerHTML=`<div class="card"><h2>Resumo da semana</h2><div class="stats"><div class="stat"><b>${stats.sessions}</b><span class="small muted">treinos</span></div><div class="stat"><b>${stats.sets}</b><span class="small muted">séries</span></div><div class="stat"><b>${stats.volume.toLocaleString('pt-BR')}</b><span class="small muted">kg volume</span></div></div></div><div class="card"><h3>Calendário · ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><div class="calendar">${calendar()}</div></div><div class="card"><h3>Peso e cintura</h3><div class="metric"><div><label>Peso (kg)</label><input id="peso" inputmode="decimal" placeholder="82,5"></div><div><label>Cintura (cm)</label><input id="cintura" inputmode="decimal" placeholder="88"></div></div><button class="primary" onclick="saveMetric()">Salvar medidas</button>${chart()}</div><div class="card"><h3>Histórico por exercício</h3><div>${exercises.map(e=>`<button class="filter ${e===selectedExercise?'active':''}" onclick='selectExercise(${JSON.stringify(e)})'>${e}</button>`).join('')}</div>${exerciseHistory(selectedExercise)}</div><div class="card"><h3>🏆 Recordes pessoais</h3>${prs()}</div><div class="card"><h3>Últimos treinos</h3>${recent.length?recent.map(s=>`<div class="history"><b>Treino ${s.code}</b> · ${date(s.date)}</div>`).join(''):'<div class="empty">Nenhum treino salvo ainda.</div>'}</div><div class="card"><h3>Backup dos dados</h3><button class="secondary" onclick="exportData()">📤 Exportar</button><button class="secondary" onclick="document.getElementById('importFile').click()">📥 Importar</button><button class="secondary" onclick="clearData()">Limpar</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><div class="muted small">Exporte um arquivo antes de trocar de celular. A importação substitui os dados atuais.</div><div class="repdb-credit">Ilustrações dos exercícios: <a href="https://repdb.co" target="_blank" rel="noopener">RepDB</a>.</div></div>`}function selectExercise(name){selectedExercise=name;renderProgress(content)}function saveMetric(){const weight=peso.value.replace(',','.'),waist=cintura.value.replace(',','.');if(!weight&&!waist){alert('Preencha pelo menos uma medida.');return}data.metrics.push({date:new Date().toISOString(),profile,weight,waist});save();renderProgress(content)}
function startTimer(sec){stopTimer();let left=sec;const el=document.getElementById('timer');function tick(){if(!el)return;el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left--<=0){clearInterval(timerInt);timerInt=null;navigator.vibrate?.(300);alert('Descanso encerrado!')}}tick();timerInt=setInterval(tick,1000)}function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}const el=document.getElementById('timer');if(el)el.textContent='00:00'}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='treino-trinca-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported.sessions)||!Array.isArray(imported.metrics))throw Error();if(!confirm('Substituir seus dados atuais pelo backup?'))return;data={sessions:imported.sessions.map(s=>({...s,profile:s.profile||'masculino'})),metrics:imported.metrics.map(m=>({...m,profile:m.profile||'masculino'}))};selectedExercise='';save();renderProgress(content);alert('Backup importado com sucesso!')}catch{alert('Arquivo de backup inválido.')}};reader.readAsText(file)}function clearData(){if(confirm('Apagar todo o histórico?')){data={sessions:[],metrics:[]};selectedExercise='';save();renderProgress(content)}}let deferredInstallPrompt=null;
function setupInstall(){const btn=document.getElementById('installBtn');const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;if(standalone){btn.hidden=true;return}if(ios){btn.hidden=false;btn.textContent='📱 Como instalar no iPhone';btn.addEventListener('click',()=>document.getElementById('iosInstallDialog').showModal());return}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;btn.hidden=false});btn.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;if(choice.outcome==='accepted')btn.hidden=true;deferredInstallPrompt=null});window.addEventListener('appinstalled',()=>{btn.hidden=true;deferredInstallPrompt=null})}
init();
</script><dialog id="iosInstallDialog" class="install-dialog"><div class="install-dialog-content"><div class="install-dialog-title">📱 Instalar no iPhone</div><p>1. Toque em <strong>Compartilhar</strong> no Safari.</p><p>2. Escolha <strong>Adicionar à Tela de Início</strong>.</p><p>3. Ative <strong>Abrir como App</strong> e toque em <strong>Adicionar</strong>.</p><button type="button" onclick="this.closest('dialog').close()">Entendi</button></div></dialog><dialog id="exerciseImageDialog" class="image-dialog"><img alt="" referrerpolicy="no-referrer"><div><strong></strong><button type="button" onclick="this.closest('dialog').close()">Fechar</button></div></dialog></body></html>
