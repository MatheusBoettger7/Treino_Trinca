<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Treino Trinca</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f3f4f6}.app{max-width:760px;margin:auto;padding-bottom:40px}.top{padding:18px 18px 8px;position:sticky;top:0;background:#0b1020ed;backdrop-filter:blur(12px);z-index:5}.brand{font-size:25px;font-weight:800}.muted{color:#9ca3af}.small{font-size:13px}.week{display:flex;gap:5px;margin-top:10px}.day{flex:1;text-align:center;padding:7px 2px;border-radius:9px;background:#151c2e;color:#9ca3af;font-size:12px}.day.active{background:#2563eb;color:#fff}.tabs{display:flex;gap:8px;padding:10px 18px;background:#0b1020;position:sticky;top:82px;z-index:4}.tabs button{flex:1}.content{padding:4px 18px}.card{background:#151c2e;border:1px solid #263149;border-radius:16px;padding:15px;margin:12px 0}.hero{display:flex;justify-content:space-between}.badge{display:inline-block;background:#263149;border-radius:999px;padding:5px 9px;font-size:12px}button,input{font:inherit}button{cursor:pointer}.primary{width:100%;border:0;border-radius:12px;padding:13px;background:#2563eb;color:#fff;font-weight:700;margin-top:8px}.secondary,.filter{border:1px solid #374151;border-radius:10px;padding:10px;background:#1f2937;color:#fff}.secondary{margin:3px}.filter{margin:3px;color:#cbd5e1}.filter.active{background:#2563eb;border-color:#2563eb}.sets{display:grid;grid-template-columns:32px 1fr 1fr 42px;gap:7px;align-items:center;margin-top:10px}.sets span{font-size:11px;color:#9ca3af;text-align:center}.sets input,.metric input{width:100%;min-width:0;background:#0d1424;border:1px solid #334155;color:#fff;border-radius:9px;padding:9px;text-align:center}.done{width:40px;height:40px;border-radius:10px;border:1px solid #475569;background:#1f2937;color:#fff}.done.on{background:#16a34a;border-color:#16a34a}.exercise h3{margin:0 0 4px;font-size:17px}.hint{margin-top:8px;color:#93c5fd;font-size:12px}.row,.metric{display:flex;gap:8px}.row>*,.metric>div{flex:1}.metric label{display:block;font-size:12px;color:#9ca3af;margin-bottom:5px}.timer{font-size:34px;font-weight:800;text-align:center;margin:8px}.listbtn{width:100%;text-align:left;border:1px solid #263149;background:#151c2e;color:#fff;border-radius:12px;padding:13px;margin:5px 0}.empty{text-align:center;color:#9ca3af;padding:20px}.history{font-size:14px;line-height:1.7;border-bottom:1px solid #263149;padding:8px 0}.history:last-child{border:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d1424;border-radius:11px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-day{aspect-ratio:1;border-radius:8px;background:#0d1424;color:#9ca3af;font-size:12px;display:grid;place-items:center}.cal-day.trained{background:#2563eb;color:#fff;font-weight:700}.chart{width:100%;height:155px;display:block}.legend{font-size:12px;color:#9ca3af;display:flex;gap:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px}.pr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #263149}.pr:last-child{border:0}@media(max-width:430px){.stats{grid-template-columns:repeat(3,1fr)}.tabs{top:78px}.top{padding-top:14px}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand">🏋️ Treino Trinca</div><div id="subtitle" class="muted small"></div><div id="week" class="week"></div></header><nav class="tabs"><button id="tHoje" onclick="show('hoje')">Hoje</button><button id="tTreinos" onclick="show('treinos')">Treinos</button><button id="tProg" onclick="show('prog')">Progresso</button></nav><main id="content" class="content"></main></div>
<script>
const workouts={A:{name:'Força + base',items:[['Agachamento',3,'5–8'],['Supino reto',3,'6–8'],['Remada',3,'6–10'],['Stiff / terra romeno',3,'8–10'],['Elevação lateral',3,'10–15'],['Rosca direta',2,'8–12'],['Tríceps na polia',2,'8–12'],['Panturrilha',3,'10–15'],['Abdominal na polia',3,'10–15']]},B:{name:'Hipertrofia',items:[['Leg press',3,'8–12'],['Supino inclinado com halteres',3,'8–12'],['Puxada alta',3,'8–12'],['Mesa flexora',3,'10–15'],['Desenvolvimento com halteres',3,'8–12'],['Crossover',2,'10–15'],['Rosca martelo',2,'10–15'],['Tríceps francês',2,'10–15'],['Panturrilha sentado',3,'12–20'],['Elevação de pernas',3,'10–15']]},C:{name:'Volume + pontos fracos',items:[['Hack squat',3,'8–12'],['Supino máquina',3,'8–12'],['Remada baixa',3,'8–12'],['Cadeira extensora',3,'10–15'],['Mesa flexora',3,'10–15'],['Elevação lateral',3,'12–20'],['Face pull',2,'12–20'],['Rosca Scott',2,'10–15'],['Tríceps corda',2,'10–15'],['Abdominal máquina',3,'10–15']]},D:{name:'Volume complementar',items:[['Cadeira extensora',3,'12–15'],['Mesa flexora',3,'12–15'],['Puxada alta',3,'10–12'],['Crossover',3,'10–15'],['Elevação lateral',3,'12–20'],['Rosca martelo',2,'10–15'],['Tríceps corda',2,'10–15'],['Panturrilha',3,'12–20'],['Abdominal',3,'12–15']]},E:{name:'Volume + condicionamento',items:[['Leg press',3,'10–15'],['Remada sentada',3,'10–15'],['Desenvolvimento máquina',3,'10–12'],['Mesa flexora',3,'12–15'],['Elevação lateral',3,'15–20'],['Face pull',3,'12–20'],['Abdominal na polia',3,'12–15'],['Cardio moderado',1,'20–30 min']]}};
const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],order={1:'A',2:'D',3:'B',4:'E',5:'C'},storageKey='treinoTrincaData';let current=order[new Date().getDay()]||'A',tab='hoje',timerInt=null,selectedExercise='';let data=loadData();
function loadData(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{"sessions":[],"metrics":[]}');return {sessions:Array.isArray(saved.sessions)?saved.sessions:[],metrics:Array.isArray(saved.metrics)?saved.metrics:[]}}catch{return {sessions:[],metrics:[]}}}function save(){localStorage.setItem(storageKey,JSON.stringify(data))}function n(v){return Number(String(v||'').replace(',','.'))||0}function date(s){return new Date(s).toLocaleDateString('pt-BR')}function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function init(){const d=new Date();subtitle.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});week.innerHTML=days.map((x,i)=>`<div class="day ${i===d.getDay()?'active':''}">${x}</div>`).join('');show('hoje');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}function show(x){tab=x;['tHoje','tTreinos','tProg'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(x==='hoje'?'tHoje':x==='treinos'?'tTreinos':'tProg').classList.add('active');render()}function render(){const c=document.getElementById('content');if(tab==='hoje')renderWorkout(c);else if(tab==='treinos')renderList(c);else renderProgress(c)}
function lastExercise(name){for(let i=data.sessions.length-1;i>=0;i--){const ex=data.sessions[i].exercises?.find(x=>x.name===name);if(ex)return ex}return null}function progression(name){const ex=lastExercise(name);if(!ex)return '';const best=ex.sets?.reduce((a,s)=>n(s.kg)>n(a?.kg)?s:a,null);if(!best||!n(best.kg)||!n(best.reps))return '';const next=(n(best.kg)+((n(best.reps)>=10)?2:0)).toLocaleString('pt-BR');return `Último: ${best.kg} kg × ${best.reps}${n(best.reps)>=10?` → tente ${next} kg`:''}`}
function renderWorkout(c){const w=workouts[current];c.innerHTML=`<div class="card hero"><div><span class="badge">Treino ${current}</span><h2>${w.name}</h2><div class="muted small">Complete uma série para iniciar automaticamente 90 s de descanso.</div></div></div><div id="exercises"></div><button class="primary" onclick="finish()">Finalizar treino</button><div class="card"><div class="row"><button class="secondary" onclick="startTimer(60)">60s</button><button class="secondary" onclick="startTimer(90)">90s</button><button class="secondary" onclick="startTimer(120)">120s</button></div><div id="timer" class="timer">00:00</div><button class="secondary" style="width:100%" onclick="stopTimer()">Parar</button></div>`;const holder=document.getElementById('exercises');w.items.forEach((it,i)=>{const old=lastExercise(it[0]);let rows='';for(let s=0;s<it[1];s++){const set=old?.sets?.[s]||{};rows+=`<span>${s+1}</span><input inputmode="decimal" placeholder="kg" value="${esc(set.kg||'')}" data-e="${i}" data-s="${s}" class="kg"><input inputmode="numeric" placeholder="reps" value="${esc(set.reps||'')}" data-e="${i}" data-s="${s}" class="reps"><button class="done" data-e="${i}" data-s="${s}" onclick="completeSet(this)">✓</button>`}holder.innerHTML+=`<div class="card exercise"><h3>${i+1}. ${it[0]}</h3><div class="muted small">${it[1]} séries · ${it[2]} repetições</div><div class="hint">${progression(it[0])||'Sem histórico neste exercício.'}</div><div class="sets"><span>Série</span><span>KG</span><span>Reps</span><span>OK</span>${rows}</div></div>`})}
function completeSet(button){button.classList.toggle('on');if(button.classList.contains('on'))startTimer(90)}function finish(){const exercises=workouts[current].items.map((it,i)=>({name:it[0],sets:[...document.querySelectorAll(`.kg[data-e="${i}"]`)].map((el,j)=>{const done=document.querySelector(`.done[data-e="${i}"][data-s="${j}"]`);const rep=document.querySelector(`.reps[data-e="${i}"][data-s="${j}"]`);return {kg:el.value,reps:rep.value,done:done?.classList.contains('on')||false}})}));const useful=exercises.some(ex=>ex.sets.some(s=>n(s.kg)||n(s.reps)));if(!useful){alert('Registre ao menos uma carga ou repetição antes de salvar.');return}data.sessions.push({date:new Date().toISOString(),code:current,exercises});save();stopTimer();alert('Treino salvo! 💪');show('prog')}
function renderList(c){c.innerHTML=`<div class="card"><h2>Seus treinos</h2><div class="muted small">Escolha qualquer treino.</div></div>${Object.entries(workouts).map(([k,w])=>`<button class="listbtn" onclick="current='${k}';show('hoje')"><b>Treino ${k}</b> — ${w.name}<br><span class="muted small">${w.items.length} exercícios</span></button>`).join('')}`}
function weekStats(){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const ss=data.sessions.filter(s=>new Date(s.date)>=start);let sets=0,volume=0;ss.forEach(s=>s.exercises?.forEach(e=>e.sets?.forEach(x=>{if(n(x.kg)||n(x.reps)){sets++;volume+=n(x.kg)*n(x.reps)}})));return {sessions:ss.length,sets,volume:Math.round(volume)}}function chart(){const ms=data.metrics.slice(-12);if(!ms.length)return '<div class="empty">Registre medidas para visualizar o gráfico.</div>';const vals=ms.flatMap(m=>[n(m.weight),n(m.waist)]).filter(Boolean),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const path=key=>ms.map((m,i)=>`${i?'L':'M'} ${i*(280/Math.max(ms.length-1,1))+10} ${130-((n(m[key])-min)/range)*105}`).join(' ');return `<svg class="chart" viewBox="0 0 300 150" role="img" aria-label="Gráfico de peso e cintura"><line x1="10" y1="130" x2="290" y2="130" stroke="#334155"/><path d="${path('weight')}" fill="none" stroke="#60a5fa" stroke-width="3"/><path d="${path('waist')}" fill="none" stroke="#f59e0b" stroke-width="3"/></svg><div class="legend"><span><i class="dot" style="background:#60a5fa"></i>Peso</span><span><i class="dot" style="background:#f59e0b"></i>Cintura</span><span>Último: ${ms.at(-1).weight||'—'} kg · ${ms.at(-1).waist||'—'} cm</span></div>`}function calendar(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),total=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),trained=new Set(data.sessions.map(s=>new Date(s.date).toDateString()));let out='';for(let i=0;i<first.getDay();i++)out+='<div></div>';for(let d=1;d<=total;d++){const x=new Date(now.getFullYear(),now.getMonth(),d);out+=`<div class="cal-day ${trained.has(x.toDateString())?'trained':''}">${d}</div>`}return out}function allExercises(){return [...new Set(data.sessions.flatMap(s=>s.exercises?.map(e=>e.name)||[]))]}function exerciseHistory(name){const logs=data.sessions.flatMap(s=>(s.exercises||[]).filter(e=>e.name===name).map(e=>({date:s.date,sets:e.sets||[]}))).reverse();if(!logs.length)return '<div class="empty">Escolha um exercício com histórico.</div>';return logs.slice(0,8).map(l=>`<div class="history"><b>${date(l.date)}</b> — ${l.sets.filter(x=>n(x.kg)||n(x.reps)).map(x=>`${x.kg||'—'} kg × ${x.reps||'—'}`).join(' · ')}</div>`).join('')}function prs(){const best={};data.sessions.forEach(s=>s.exercises?.forEach(e=>e.sets?.forEach(x=>{if(!n(x.kg)&&!n(x.reps))return;const old=best[e.name]||{kg:0,reps:0};best[e.name]={kg:Math.max(old.kg,n(x.kg)),reps:Math.max(old.reps,n(x.reps))}})));const entries=Object.entries(best);return entries.length?entries.sort((a,b)=>b[1].kg-a[1].kg).map(([name,v])=>`<div class="pr"><span>${name}</span><b>${v.kg||'—'} kg · ${v.reps||'—'} reps</b></div>`).join(''):'<div class="empty">Seus recordes aparecerão aqui.</div>'}function renderProgress(c){const stats=weekStats(),recent=data.sessions.slice(-8).reverse(),exercises=allExercises();if(!selectedExercise&&exercises.length)selectedExercise=exercises[0];c.innerHTML=`<div class="card"><h2>Resumo da semana</h2><div class="stats"><div class="stat"><b>${stats.sessions}</b><span class="small muted">treinos</span></div><div class="stat"><b>${stats.sets}</b><span class="small muted">séries</span></div><div class="stat"><b>${stats.volume.toLocaleString('pt-BR')}</b><span class="small muted">kg volume</span></div></div></div><div class="card"><h3>Calendário · ${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><div class="calendar">${calendar()}</div></div><div class="card"><h3>Peso e cintura</h3><div class="metric"><div><label>Peso (kg)</label><input id="peso" inputmode="decimal" placeholder="82,5"></div><div><label>Cintura (cm)</label><input id="cintura" inputmode="decimal" placeholder="88"></div></div><button class="primary" onclick="saveMetric()">Salvar medidas</button>${chart()}</div><div class="card"><h3>Histórico por exercício</h3><div>${exercises.map(e=>`<button class="filter ${e===selectedExercise?'active':''}" onclick='selectExercise(${JSON.stringify(e)})'>${e}</button>`).join('')}</div>${exerciseHistory(selectedExercise)}</div><div class="card"><h3>🏆 Recordes pessoais</h3>${prs()}</div><div class="card"><h3>Últimos treinos</h3>${recent.length?recent.map(s=>`<div class="history"><b>Treino ${s.code}</b> · ${date(s.date)}</div>`).join(''):'<div class="empty">Nenhum treino salvo ainda.</div>'}</div><div class="card"><h3>Backup dos dados</h3><button class="secondary" onclick="exportData()">📤 Exportar</button><button class="secondary" onclick="document.getElementById('importFile').click()">📥 Importar</button><button class="secondary" onclick="clearData()">Limpar</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><div class="muted small">Exporte um arquivo antes de trocar de celular. A importação substitui os dados atuais.</div></div>`}function selectExercise(name){selectedExercise=name;renderProgress(content)}function saveMetric(){const weight=peso.value.replace(',','.'),waist=cintura.value.replace(',','.');if(!weight&&!waist){alert('Preencha pelo menos uma medida.');return}data.metrics.push({date:new Date().toISOString(),weight,waist});save();renderProgress(content)}
function startTimer(sec){stopTimer();let left=sec;const el=document.getElementById('timer');function tick(){if(!el)return;el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left--<=0){clearInterval(timerInt);timerInt=null;navigator.vibrate?.(300);alert('Descanso encerrado!')}}tick();timerInt=setInterval(tick,1000)}function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}const el=document.getElementById('timer');if(el)el.textContent='00:00'}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='treino-trinca-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported.sessions)||!Array.isArray(imported.metrics))throw Error();if(!confirm('Substituir seus dados atuais pelo backup?'))return;data={sessions:imported.sessions,metrics:imported.metrics};selectedExercise='';save();renderProgress(content);alert('Backup importado com sucesso!')}catch{alert('Arquivo de backup inválido.')}};reader.readAsText(file)}function clearData(){if(confirm('Apagar todo o histórico?')){data={sessions:[],metrics:[]};selectedExercise='';save();renderProgress(content)}}init();
</script></body></html>
