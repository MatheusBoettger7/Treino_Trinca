<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<script>
/* Carrega o tema e os ícones corretos antes de o navegador preparar a instalação. */
(function(){
  var theme='blue';
  try{theme=localStorage.getItem('treinoTrincaTheme')==='red'?'red':'blue';}catch(e){}
  document.documentElement.dataset.theme=theme;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=theme==='blue'?'#0b1020':'#080808';
  var manifest=document.createElement('link');
  manifest.rel='manifest';
  manifest.id='appManifest';
  manifest.href=theme==='red'?'manifest-red.webmanifest':'manifest-blue.webmanifest';
  document.head.appendChild(manifest);
  var appleIcon=document.createElement('link');
  appleIcon.rel='apple-touch-icon';
  appleIcon.id='appleTouchIcon';
  appleIcon.sizes='180x180';
  appleIcon.type='image/png';
  appleIcon.href='assets/treino-trinca-icon-'+theme+'-180.png?v=93';
  document.head.appendChild(appleIcon);
  window.setTreinoTrincaThemeAssets=function(nextTheme){
    var value=nextTheme==='red'?'red':'blue';
    manifest.href=value==='red'?'manifest-red.webmanifest':'manifest-blue.webmanifest';
    appleIcon.href='assets/treino-trinca-icon-'+value+'-180.png?v=93';
  };
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino Trinca">

</head>
