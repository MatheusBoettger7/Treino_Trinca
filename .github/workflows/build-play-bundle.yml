name: Build Android Play Bundle

on:
  push:
    branches:
      - producao
    paths:
      - 'android/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - '.github/workflows/build-play-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release App Bundle
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Prepare AAB artifact
        run: cp android/app/build/outputs/bundle/release/app-release.aab Treino-Trinca-v2026.09.30.61-release-unsigned.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Trinca-v2026.09.30.61-release-unsigned
          path: Treino-Trinca-v2026.09.30.61-release-unsigned.aab
          retention-days: 30