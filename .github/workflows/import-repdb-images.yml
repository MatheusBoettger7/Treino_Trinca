name: Import RepDB exercise images

on:
  push:
    branches:
      - "teste/detalhes-exercicio"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: \${{ !contains(github.event.head_commit.message || '', '[skip repdb import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import RepDB images
        run: node tools/import-repdb-images.mjs

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exercises assets/repdb data/repdb-image-map.json data/app-repdb-media.json
          if git diff --cached --quiet; then
            echo "Nenhuma imagem nova para gravar."
            exit 0
          fi
          git commit -m "Importar imagens RepDB para exercícios PT-BR [skip repdb import]"
          git push origin "HEAD:teste/detalhes-exercicio"
