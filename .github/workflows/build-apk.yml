name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Treino-Trinca-v2026.09.21.47-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Trinca-v2026.09.21.47
          path: Treino-Trinca-v2026.09.21.47-debug.apk
          retention-days: 30
